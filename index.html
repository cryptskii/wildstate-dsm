<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The game server this build connects to; the Android build checks it. -->
    <meta name="wildstate-game-host" content="%VITE_GAME_HOST%" />
    <title>Wildstate</title>
    <link rel="icon" type="image/png" href="/brand/icon-64.png">
    <link rel="apple-touch-icon" href="/brand/icon-512.png">
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default/theme.css">
    <style>
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      /* The Wildstate logo, wherever it appears: a light sweeping across the letters and stars
         twinkling around them. Markup: src/gui/logo.ts. */
      .ws-logo{position:relative;display:inline-block;line-height:0}
      .ws-logo img{display:block;width:100%;height:auto}
      .ws-shine{position:absolute;inset:0;pointer-events:none;-webkit-mask:url(/brand/logo.png) 0 0/100% 100% no-repeat;mask:url(/brand/logo.png) 0 0/100% 100% no-repeat;background:linear-gradient(105deg,transparent 42%,#fff8dccc 50%,transparent 58%) no-repeat;background-size:260% 100%;animation:ws-shine 5s ease-in-out infinite}
      .ws-star{position:absolute;width:7%;aspect-ratio:1;pointer-events:none;background:url(/brand/star-64.png) center/contain no-repeat;image-rendering:pixelated;opacity:0;animation:ws-twinkle 2.8s ease-in-out infinite;filter:drop-shadow(0 0 4px #ffe58a)}
      .ws-star.s1{left:1%;top:-6%}.ws-star.s2{left:24%;top:2%;animation-delay:.7s}.ws-star.s3{left:41%;top:-10%;animation-delay:1.5s}.ws-star.s4{left:69%;top:-4%;animation-delay:2.1s}.ws-star.s5{left:94%;top:20%;animation-delay:1.1s}
      @keyframes ws-shine{0%,50%{background-position:160% 0}100%{background-position:-60% 0}}
      @keyframes ws-twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(-30deg)}45%,55%{opacity:1;transform:scale(1) rotate(0)}}
      @media (prefers-reduced-motion:reduce){.ws-shine,.ws-star{animation:none}}
      /* Shown the moment the app opens, until the game is ready. */
      #splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#10251b;transition:opacity .5s}
      #splash.out{opacity:0;pointer-events:none}
      #splash .ws-logo{width:min(80vw,560px)}
    </style>
  </head>
  <body>
    <div id="rpg"></div>
    <div id="splash"><div class="ws-logo"><img src="/brand/logo.png" alt="Wildstate, secured by DSM"><i class="ws-shine"></i><i class="ws-star s1"></i><i class="ws-star s2"></i><i class="ws-star s3"></i><i class="ws-star s4"></i><i class="ws-star s5"></i></div></div>

</body>
</html>
